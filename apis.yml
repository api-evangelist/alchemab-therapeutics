name: Alchemab Therapeutics
description: Alchemab Therapeutics is a UK-based clinical-stage biotechnology company
  developing next-generation antibody therapeutics for hard-to-treat diseases. Its
  "Adaptive Immunity" platform identifies naturally resilient individuals, such as
  long-term cancer survivors, and harnesses their protective antibodies, using
  artificial intelligence and deep learning to translate these natural immune
  responses into novel human-derived therapeutics across neurodegeneration,
  oncology, and other areas of high unmet need. Alchemab was surfaced as a portfolio
  company of DCVC and added to the API Evangelist network. As a research-stage
  therapeutics company it publishes no public developer API program, SDKs, or
  machine-readable API specifications at this time.
